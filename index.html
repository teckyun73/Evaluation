<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 경영혁신 경진대회 평가 시스템</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="혁신평가">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Canvas Confetti CDN (시상식 축하 폭죽 효과) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="./css/style.css?v=20260820_v3">
</head>
<body class="text-slate-800 antialiased min-h-screen">

    <!-- 오프라인 네트워크 경고 배너 -->
    <div id="offline-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-red-600 text-white text-center py-2 px-4 text-xs md:text-sm font-bold shadow-lg flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        네트워크 연결이 끊겼습니다. 오프라인 상태에서는 점수가 서버에 저장되지 않습니다. 연결을 확인해 주세요.
    </div>

    <!-- 로그인 컨테이너 -->
    <div id="login-container" class="flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
            <div class="text-center mb-6">
                <span class="text-xs font-bold tracking-widest text-sky-600 uppercase bg-sky-50 px-3 py-1 rounded-full">2026 INNOVATION AWARDS</span>
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 mt-3">경영혁신 경진대회</h2>
                <p class="text-sm text-slate-500 mt-1">실시간 온라인 평가 & 투표 시스템</p>
            </div>
            
            <div class="grid grid-cols-3 gap-1 mb-6 border border-slate-200 rounded-lg p-1 bg-slate-50">
                <button id="role-evaluator" class="role-selector-btn flex-1 py-2 px-3 rounded-md text-sm font-semibold transition">평가자</button>
                <button id="role-voter" class="role-selector-btn flex-1 py-2 px-3 rounded-md text-sm font-semibold transition">투표자</button>
                <button id="role-admin" class="role-selector-btn flex-1 py-2 px-3 rounded-md text-sm font-semibold transition">관리자</button>
            </div>
            <input type="hidden" id="login-role" value="evaluator">

            <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg relative mb-6 text-sm" role="alert">
                <span class="block sm:inline" id="login-error-message"></span>
            </div>
            <div class="space-y-4">
                <div>
                    <label for="login-id" id="login-id-label" class="block text-xs font-semibold text-slate-700 mb-1">성명</label>
                    <input type="text" id="login-id" placeholder="성명 (예: 홍길동)" class="block w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                </div>
                <div>
                    <label for="password" id="password-label" class="block text-xs font-semibold text-slate-700 mb-1">비밀번호</label>
                    <input type="password" id="password" class="block w-full px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                </div>
                <button id="login-btn" class="w-full mt-2 flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-sky-600 hover:bg-sky-700 transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
                    로그인
                </button>
            </div>

            <!-- PDF 다운로드 링크 -->
            <div class="mt-8 pt-6 border-t border-slate-100 text-center">
                <a href="https://drive.google.com/file/d/1AyafN2H5GZ4dOcM6lpkk_ziknGKnJN-w/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-xs font-medium text-sky-600 hover:text-sky-800 transition">
                    <svg class="w-4 h-4 mr-1.5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    2026년 경영혁신경진대회 식순 및 발표 요약문집
                </a>
            </div>
        </div>
    </div>

    <!-- 메인 앱 컨테이너 -->
    <div id="app-container" class="hidden container mx-auto p-4 md:p-8 max-w-7xl">
        <header class="text-center mb-6">
            <span class="text-xs font-bold tracking-widest text-sky-600 uppercase bg-sky-50 px-3 py-1 rounded-full">2026 EVALUATION SYSTEM</span>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mt-2">2026 경영혁신 경진대회 평가 시스템</h1>
            <p class="text-sm text-slate-500 mt-1">실시간 온라인 평가 및 종합 집계</p>
            
            <!-- 헤더 툴바 버튼들 (동일한 높이와 깔끔한 인라인 플렉스 정렬) -->
            <div class="mt-5 flex flex-wrap justify-center items-center gap-2">
                <button id="simulationBtn" class="hidden toolbar-btn bg-sky-600 hover:bg-sky-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap">
                    가상 평가 시뮬레이션
                </button>
                <button id="exportBtn" class="hidden toolbar-btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap">
                    CSV 저장
                </button>
                <button id="backupJsonBtn" class="hidden toolbar-btn bg-teal-600 hover:bg-teal-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap flex items-center gap-1.5">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    <span>DB 백업 (JSON)</span>
                </button>
                <button id="restoreJsonBtn" class="hidden toolbar-btn bg-slate-600 hover:bg-slate-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap flex items-center gap-1.5">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span>DB 복원</span>
                </button>
                <input type="file" id="restoreFileInput" accept=".json" class="hidden">
                
                <button id="printBtn" class="hidden toolbar-btn bg-slate-700 hover:bg-slate-800 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap flex items-center gap-1.5">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    <span>보고서 인쇄</span>
                </button>
                <button id="resetSimBtn" class="hidden toolbar-btn bg-red-600 hover:bg-red-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap">
                    시뮬레이션 초기화
                </button>
                <button id="fullResetBtn" class="hidden toolbar-btn bg-red-800 hover:bg-red-900 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap">
                    전체 데이터 초기화
                </button>
                <button id="save-logout-btn" class="hidden toolbar-btn bg-orange-500 hover:bg-orange-600 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-sm whitespace-nowrap">
                    로그아웃
                </button>
            </div>
            
            <div id="userInfo" class="mt-4 text-xs font-semibold text-slate-500"></div>
        </header>

        <!-- 관리자 전용 실시간 진척도 대시보드 슬롯 -->
        <div id="admin-dashboard-slot" class="hidden"></div>

        <main class="bg-white p-5 md:p-8 rounded-2xl shadow-lg border border-slate-100">
            <div class="border-b border-slate-200 mb-6">
                <nav class="flex flex-wrap -mb-px gap-1" id="tab-buttons">
                    <button data-tab="6s" class="tab-button active text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">6S</button>
                    <button data-tab="six_sigma" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">6시그마</button>
                    <button data-tab="rnd" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">R&D</button>
                    <button data-tab="ai" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">AI</button>
                    <button data-tab="results" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">종합 결과</button>
                    <button data-tab="presentation_results" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">발표 결과</button>
                    <button data-tab="radar_analysis" class="tab-button text-sm md:text-base font-medium text-center text-teal-600 border-b-2 border-transparent px-4 py-3 hover:text-teal-800 hover:border-teal-300">📊 역량 분석</button>
                    <button data-tab="award_ceremony" class="tab-button text-sm md:text-base font-bold text-center text-amber-600 border-b-2 border-transparent px-4 py-3 hover:text-amber-800 hover:border-amber-300">🏆 시상식</button>
                    <button data-tab="live_vote_status" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">실시간 투표 현황</button>
                    <button data-tab="detailed_results" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">평가자별 상세 결과</button>
                    <button data-tab="voter_detailed_results" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">투표자별 상세 결과</button>
                    <button data-tab="final_results" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">최종 결과</button>
                    <button data-tab="excellent_presenters" class="tab-button text-sm md:text-base font-medium text-center text-slate-500 border-b-2 border-transparent px-4 py-3 hover:text-slate-700 hover:border-slate-300">우수 발표자</button>
                    <button data-tab="admin_settings" class="tab-button text-sm md:text-base font-medium text-center text-purple-600 border-b-2 border-transparent px-4 py-3 hover:text-purple-800 hover:border-purple-300">⚙️ 설정 관리</button>
                </nav>
            </div>

            <div id="tab-content"></div>
        </main>
    </div>

    <!-- 알림 / 확인 모달 -->
    <div id="messageModal" class="fixed inset-0 bg-gray-900 bg-opacity-60 hidden items-center justify-center z-50 transition-opacity duration-300 opacity-0 p-4">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-md text-center transform transition-all duration-300 scale-95 opacity-0 border border-slate-100" id="modal-content">
            <h3 class="text-xl font-bold text-slate-800 mb-3" id="modalTitle">알림</h3>
            <p id="modalMessage" class="text-slate-600 text-sm md:text-base mb-6 leading-relaxed"></p>
            <div id="modal-buttons" class="flex justify-end gap-3">
                 <button id="closeModalBtn" class="bg-slate-100 text-slate-700 px-5 py-2.5 rounded-lg hover:bg-slate-200 transition font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-400">취소</button>
                 <button id="confirmModalBtn" class="bg-sky-600 text-white px-5 py-2.5 rounded-lg hover:bg-sky-700 transition font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 shadow-sm">확인</button>
            </div>
        </div>
    </div>

    <!-- ES Module Main Entry -->
    <script type="module" src="./src/app.js?v=20260820_v3"></script>
</body>
</html>
