<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 경영혁신 경진대회 시상식 무대</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* 별도 창(대형 스크린용)에서는 모든 운영용 기능 박스들을 강제로 100% 영구 은닉 */
        #ceremony-controls-toolbar,
        #ceremony-category-select,
        #toggle-ceremony-sound-btn,
        #reset-ceremony-btn,
        #open-ceremony-window-btn,
         chivalry-buttons,
        #toggle-ceremony-fullscreen-btn,
        #next-reveal-btn,
        .ceremony-controls-wrapper {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
            height: 0 !important;
            width: 0 !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* 대화면 웅장한 무대 카드 스타일 */
        .standalone-stage .ceremony-card {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen bg-slate-100 flex flex-col justify-between p-4 md:p-8">

    <!-- 시상식 전용 컨테이너 슬롯 -->
    <main id="ceremony-standalone-root" class="max-w-7xl mx-auto w-full flex-grow flex flex-col justify-center">
        <div class="text-center text-slate-500 py-20 animate-pulse font-bold text-lg">
            시상식 무대 데이터를 동기화하는 중입니다...
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="text-center text-xs text-slate-400 mt-6 border-t border-slate-200 pt-4">
        2026 경영혁신 경진대회 시상식 무대 시스템 &copy; ATEC
    </footer>

    <!-- 시상식 전용 모듈 스크립트 (캐시 버스팅 쿼리 포함) -->
    <script type="module" src="./src/ceremony.js?v=20260820_v6"></script>
</body>
</html>
