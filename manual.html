    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            font-size: 16px;
        }
        body {
            font-family: 'Inter', 'Pretendard', -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 50%, #eef2ff 100%);
            color: #0f172a;
            font-size: 16px;
            line-height: 1.6;
            overflow-x: hidden;
        }
        /* 경영진 및 외부심사위원 가독성을 위한 최소 폰트 사이즈 14px 강제 보장 */
        .manual-root,
        .manual-root * {
            font-size: max(14px, 0.875rem);
        }
        .title-xl { font-size: clamp(24px, 2.2vw, 32px) !important; line-height: 1.25 !important; }
        .title-lg { font-size: clamp(20px, 1.6vw, 24px) !important; line-height: 1.35 !important; }
        .title-md { font-size: 18px !important; line-height: 1.4 !important; }
        .text-body { font-size: 16px !important; line-height: 1.6 !important; }
        .text-min { font-size: 14px !important; line-height: 1.5 !important; }

        /* 슬라이드 컨테이너 (16:9 와이드 파워포인트 비율 감성) */
        .slide-deck-frame {
            min-height: calc(100vh - 148px);
            display: flex;
            align-items: stretch;
        }
        .step-card {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        .step-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.12);
        }
        .step-card.active-step {
            border-color: #0284c7 !important;
            background-color: #f0f9ff !important;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.18);
        }
        .sim-window {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 1rem;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.12);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .pulse-ring {
            animation: pulseRing 2s infinite;
        }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.45); }
            70% { box-shadow: 0 0 0 8px rgba(14, 165, 233, 0); }
            100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
        }
        /* 인쇄 시 전체 슬라이드 연속 출력 지원 */
        @media print {
            body { background: #ffffff !important; }
            .no-print { display: none !important; }
            .slide-deck-frame { min-height: auto !important; page-break-after: always; }
        }

</head>

                                <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                                <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
                                <span class="ml-2 font-bold text-slate-300">2026 경영혁신 경진대회 평가 시스템 — ${slide.title}</span>
                            </div>
                            <span class="px-2.5 py-0.5 rounded bg-slate-700 text-sky-300 font-bold">Interactive Preview</span>
                        </div>

                        <!-- 슬라이드별 인터랙티브 본문 -->
                        <div class="flex-1 flex flex-col justify-center">
                            ${renderInteractiveRightPane(slide)}
                        </div>
                    </div>
                </div>
            `;

            updateNavigationUI(realIdx);
        }

        function updateNavigationUI(realIdx) {
            const total = filteredSlideIndices.length;
            const counterEl = document.getElementById('slide-counter-text');
            if (counterEl) {
                counterEl.textContent = `Slide ${currentPos + 1} / ${total}`;
            }

            const prevBtn = document.getElementById('prev-slide-btn');
            const nextBtn = document.getElementById('next-slide-btn');
            if (prevBtn) prevBtn.disabled = currentPos <= 0;
            if (nextBtn) nextBtn.disabled = currentPos >= total - 1;

            // 슬라이드 도트 렌더링
            const dotsEl = document.getElementById('slide-dots');
            if (dotsEl) {
                dotsEl.innerHTML = filteredSlideIndices.map((sIdx, pos) => `
                    <button type="button" onclick="window.manualApp.goToPos(${pos})"
                        title="${SLIDES[sIdx].title}"
                        class="h-3 rounded-full transition-all ${pos === currentPos ? 'w-8 bg-sky-600' : 'w-3 bg-slate-300 hover:bg-slate-400'}">
                    </button>
                `).join('');
            }

            // 드롭다운 점프 메뉴 동기화
            const jumpSelect = document.getElementById('slide-jump-select');
            if (jumpSelect) {
                jumpSelect.innerHTML = filteredSlideIndices.map((sIdx, pos) => `
                    <option value="${pos}" ${pos === currentPos ? 'selected' : ''}>
                        [${pos + 1}/${total}] ${SLIDES[sIdx].title}
                    </option>
                `).join('');
            }
        }

        // 전역 인터랙션 컨트롤러 노출
        window.manualApp = {
            goToPos(pos) {
                if (pos >= 0 && pos < filteredSlideIndices.length) {
                    currentPos = pos;
                    activeStepIndex = 0;
                    renderSlide();
                }
            },
            selectStep(idx) {
                activeStepIndex = idx;
                renderSlide();
            },
            setOverviewCat(cat) {
                simState.overviewCat = cat;
                renderSlide();
            },
            setLoginRole(role) {
                simState.loginRole = role;
                simState.loginSuccess = false;
                renderSlide();
            },
            setLoginName(val) {
                simState.loginName = val;
            },
            triggerLoginDemo() {
                simState.loginSuccess = true;
                activeStepIndex = 1;
                renderSlide();
            },
            updateDemoScore(pKey, idx, max, inputEl) {
                let val = parseInt(inputEl.value, 10);
                if (isNaN(val) || val < 0) val = 0;
                if (val > max) {
                    val = max;
                    inputEl.value = max;
                }
                simState.scores[pKey][idx] = val;
                renderSlide();
            },
            fillSampleScores() {
                simState.scores.p1 = [15, 14, 15, 24, 19, 10];
                simState.scores.p2 = [14, 14, 13, 23, 18, 9];
                simState.scores.p3 = [15, 15, 15, 25, 19, 10];
                renderSlide();
            },
            updateDemoComment(val) {
                simState.commentText = val;
                simState.autosaveStatus = 'saving';
                renderSlide();
                clearTimeout(window._autoSaveTimer);
                window._autoSaveTimer = setTimeout(() => {
                    simState.autosaveStatus = 'saved';
                    renderSlide();
                }, 500);
            },
            runLogoutRestoreDemo() {
                simState.sessionDemoStep = 'logged_out';
                activeStepIndex = 2;
                renderSlide();
                setTimeout(() => {
                    simState.sessionDemoStep = 'restored';
                    activeStepIndex = 3;
                    renderSlide();
                }, 1200);
            },
            setSubmitViewMode(mode) {
                simState.submitViewMode = mode;
                activeStepIndex = mode === 'radar' ? 2 : 0;
                renderSlide();
            },
            toggleSubmitDemo() {
                simState.isSubmitted = !simState.isSubmitted;
                activeStepIndex = simState.isSubmitted ? 1 : 0;
                renderSlide();
            },
            selectRadarPresenter(idx) {
                simState.selectedRadarPresenter = idx;
                renderSlide();
            },
            triggerAdminTool(tool) {
                if (tool === 'year') {
                    simState.adminArchiveYear = simState.adminArchiveYear === '2026' ? '2025' : '2026';
                    simState.adminToolbarMsg = simState.adminArchiveYear === '2025'
                        ? '📁 [2025년 아카이브 모드]로 전환되었습니다. 과거 4개 부문 최종 결과를 안전하게 조회 전용으로 열람합니다.'
                        : '📅 [2026년 대회 진행 모드]로 복귀했습니다. 지원·기술 2개 부문 실시간 평가가 활성화됩니다.';
                } else if (tool === 'sim') {
                    simState.adminSimRunning = true;
                    simState.adminToolbarMsg = '✨ 가상 평가자 6명의 점수와 임직원 투표 데이터가 생성되어 대시보드 진행률이 100%로 갱신되었습니다!';
                } else if (tool === 'csv') {
                    simState.adminToolbarMsg = '📊 전체 평가 점수 및 투표 결과가 엑셀 호환 CSV 파일(UTF-8 BOM)로 즉시 다운로드됩니다.';
                } else if (tool === 'backup') {
                    simState.adminToolbarMsg = '💾 현재 대회의 모든 설정·점수·투표 데이터를 JSON 파일로 백업하여 로컬 PC에 안전하게 보관합니다.';
                } else if (tool === 'print') {
                    simState.adminToolbarMsg = '🖨️ 현재 보고 있는 종합 결과 또는 최종 결과 보고서를 A4 규격에 맞춰 깔끔하게 인쇄합니다.';
                } else if (tool === 'resetSim') {
                    simState.adminSimRunning = false;
                    simState.adminToolbarMsg = '🧹 실제 심사위원의 점수는 보존하고, 가상 시뮬레이션으로 생성된 테스트 데이터만 안전하게 삭제했습니다.';
                }
                renderSlide();
            },
            setVoteCat(cat) {
                simState.voteCat = cat;
                activeStepIndex = cat === 'support' ? 0 : 1;
                renderSlide();
            },
            addDemoVote(idx) {
                if (simState.voteCat === 'support') {
                    simState.supportVotes[idx] += 3;
                } else {
                    simState.techVotes[idx] += 3;
                }
                renderSlide();
            },
            changeFinalAward(idx, newAward) {
                simState.finalAwards[idx].award = newAward;
                simState.finalSavedToast = false;
                activeStepIndex = 2;
                renderSlide();
            },
            saveFinalAwardsDemo() {
                simState.finalSavedToast = true;
                activeStepIndex = 2;
                renderSlide();
            },
            nextCeremonyStep() {
                if (simState.ceremonyStep < 4) {
                    simState.ceremonyStep += 1;
                }
                activeStepIndex = 1;
                renderSlide();
            },
            resetCeremonyStep() {
                simState.ceremonyStep = 0;
                renderSlide();
            },
            updateSettingsDocUrl(val) {
                simState.settingsDocUrl = val;
                simState.settingsSavedToast = false;
            },
            updateSettingsMax(idx, val) {
                simState.settingsCriteriaMax[idx] = parseInt(val, 10) || 0;
                simState.settingsSavedToast = false;
                activeStepIndex = 2;
                renderSlide();
            },
            saveSettingsDemo() {
                simState.settingsSavedToast = true;
                renderSlide();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.filter-tab-btn').forEach(btn => {
                btn.addEventListener('click', () => updateFilter(btn.dataset.filter));
            });

            document.getElementById('prev-slide-btn')?.addEventListener('click', () => {
                if (currentPos > 0) {
                    currentPos -= 1;
                    activeStepIndex = 0;
                    renderSlide();
                }
            });

            document.getElementById('next-slide-btn')?.addEventListener('click', () => {
                if (currentPos < filteredSlideIndices.length - 1) {
                    currentPos += 1;
                    activeStepIndex = 0;
                    renderSlide();
                }
            });

            document.getElementById('slide-jump-select')?.addEventListener('change', (e) => {
                window.manualApp.goToPos(parseInt(e.target.value, 10));
            });

            document.getElementById('fullscreen-btn')?.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });

            // 키보드 좌우 화살표 슬라이드 이동 (입력창 포커스 중에는 제외)
            document.addEventListener('keydown', (e) => {
                const tag = (e.target?.tagName || '').toLowerCase();
                if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

                if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    if (currentPos < filteredSlideIndices.length - 1) {
                        currentPos += 1;
                        activeStepIndex = 0;
                        renderSlide();
                    }
                } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    if (currentPos > 0) {
                        currentPos -= 1;
                        activeStepIndex = 0;
                        renderSlide();
                    }
                }
            });

            const hashRole = (window.location.hash || '').replace('#', '');
            if (hashRole === 'evaluator' || hashRole === 'admin') {
                updateFilter(hashRole);
            } else {
                renderSlide();
            }
        });
    </script>
</body>
</html>
